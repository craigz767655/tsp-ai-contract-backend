# Render Blueprint — TSP AI Contract backend + Postgres.
# In Render: New → Blueprint → connect this repo. Render reads this file and
# provisions both services. Fill secrets (JWT_SECRET, AI keys) in the dashboard.
services:
  - type: web
    name: tsp-ai-contract-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tsp-ai-contract-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret
      - key: ALLOWED_ORIGINS
        sync: false                   # set to your Lovable URL in the dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest

databases:
  - name: tsp-ai-contract-db
    plan: basic-256mb
    databaseName: tsp_ai_contract
    user: tsp
